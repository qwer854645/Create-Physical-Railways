plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def patchDevClientConfig = {
    def configDir = file('run/config')
    configDir.mkdirs()

    def flywheel = file('run/config/flywheel-client.toml')
    if (flywheel.exists()) {
        def text = flywheel.getText('UTF-8')
        text = text.replace('backend = "DEFAULT"', 'backend = "flywheel:instancing"')
        text = text.replace('backend = "OFF"', 'backend = "flywheel:instancing"')
        text = text.replace('backend = "flywheel:indirect"', 'backend = "flywheel:instancing"')
        text = text.replace('workerThreads = -1', 'workerThreads = 0')
        text = text.replace('workerThreads = 1', 'workerThreads = 0')
        text = text.replace('workerThreads = 2', 'workerThreads = 0')
        flywheel.setText(text, 'UTF-8')
    }
}

tasks.register('prepareDevClientConfig') {
    group = 'neoforge'
    description = 'Apply stable Flywheel settings for Windows dev client'
    doLast(patchDevClientConfig)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }

        client {
            client()
            if (project.hasProperty('captureBogeys')) {
                systemProperty 'guidedrailways.captureBogeys', 'true'
                systemProperty 'guidedrailways.captureBogeysOutput', file('build/bogey-capture.json').absolutePath
            }
            gameDirectory = file('run')
            taskBefore tasks.named('prepareDevClientConfig')
            if (project.hasProperty('srailDemoWorld')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('srailDemoWorld').toString()
            }
        }

        data {
            data()
            gameDirectory = file('run')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        guidedrailways {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Optional local mirror for development machines whose Gradle TLS requests reset.
    // It contains only unmodified official artifacts and is never packaged.
    if (file('libs/compat-maven').isDirectory()) {
        maven { url = uri('libs/compat-maven'); content {
            includeModule 'net.neoforged', 'neoforge'
            includeModule 'net.createmod.ponder', 'ponder-neoforge'
        } }
    }
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        name = 'RyanHCode'
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
            includeGroup 'dev.simulated_team.simulated'
            includeGroup 'dev.eriksonn.aeronautics'
        }
    }
}

configurations {
    devRuntimeMods
}

// Compile against the same unmodified Simulated API that the optional bundled mod supplies.
// The extracted API is never packaged or copied into run/mods as a second mod.
def simulatedApiFile = providers.gradleProperty('simulated_api_jar')
def simulatedBundle = file('libs/create-aeronautics-bundled-1.21.1-1.3.2.jar')
def extractedSimulated = layout.buildDirectory.file('compat-api/simulated-neoforge-1.21.1-1.3.2.jar')
def extractSimulatedApi = tasks.register('extractSimulatedApi', Copy) {
    onlyIf { !simulatedApiFile.isPresent() && simulatedBundle.exists() }
    if (simulatedBundle.exists()) {
        from(zipTree(simulatedBundle)) { include 'META-INF/jarjar/dev.simulated_team.simulated.simulated-neoforge-1.21.1-1.3.2.jar'; eachFile { path = name } }
    }
    into layout.buildDirectory.dir('compat-api')
    rename 'dev.simulated_team.simulated.simulated-neoforge-1.21.1-1.3.2.jar', 'simulated-neoforge-1.21.1-1.3.2.jar'
    includeEmptyDirs = false
}

dependencies {
    def railwaysApi = file(providers.gradleProperty('railways_api_jar').getOrElse("libs/railways-${railways_version}.jar"))
    if (!railwaysApi.exists()) throw new GradleException('Missing optional-mod compile API: run powershell -NoProfile -ExecutionPolicy Bypass -File verification/prepare_railways.ps1')
    compileOnly files(railwaysApi)
    compileOnly files(providers.gradleProperty('bnb_api_jar').getOrElse('libs/create_bb-1.0.8-1.21.1.jar'),
                      providers.gradleProperty('cee_api_jar').getOrElse('libs/electroenergetics-1.21.1-1.1.4.jar'))
    if (simulatedApiFile.isPresent()) compileOnly files(simulatedApiFile.get())
    else if (simulatedBundle.exists()) compileOnly files(extractedSimulated).builtBy(extractSimulatedApi)
    else compileOnly('dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.3.2') { transitive = false }
    testImplementation("com.google.code.gson:gson:2.10.1")
    testImplementation 'org.joml:joml:1.10.5'
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        artifact { classifier = 'slim' }
        transitive = false
    }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")

    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"))

    // The publisher release jar is also usable when the Sable Maven host is unavailable.
    def sableRelease = file(providers.gradleProperty('sable_api_jar').getOrElse("libs/sable-neoforge-${minecraft_version}-${sable_version}.jar"))
    if (sableRelease.exists()) compileOnly files(sableRelease)
    else compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }

    devRuntimeMods("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    devRuntimeMods("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    devRuntimeMods("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    if (sableRelease.exists()) devRuntimeMods files(sableRelease)
    else devRuntimeMods("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
}

tasks.register('copyDevMods', Copy) {
    into file('run/mods')
    from('libs') {
        include '*.jar'

    }
    from configurations.devRuntimeMods
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doFirst {
        // Copy leaves old versions behind. Remove only superseded managed development jars.
        def selected = (fileTree('libs') { include '*.jar' }.files + configurations.devRuntimeMods.files)*.name as Set
        def managed = ['create-1.21.1-', 'sable-neoforge-1.21.1-', 'ponder-neoforge-', 'flywheel-neoforge-1.21.1-',
                       'railways-', 'create_bb-', 'electroenergetics-', 'VS-Sable-HoseConnectors-',
                       'create-aeronautics-bundled-', 'create_aeronautics_automated_logistics-', 'xaerominimap-']
        file('run/mods').listFiles()?.findAll { f ->
            f.isFile() && f.name.endsWith('.jar') && !selected.contains(f.name) && managed.any { f.name.startsWith(it) }
        }?.each { f ->
            if (!f.delete()) throw new GradleException("Cannot replace obsolete development mod: ${f.name}")
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn copyDevMods
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.incremental = false
    options.forkOptions.memoryMaximumSize = '2g'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            create_version_range    : create_version_range,
            sable_version_range     : sable_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    from('.') { include 'LICENSE' }
}


